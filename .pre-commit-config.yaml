repos:
  - repo: https://github.com/astral-sh/ty-pre-commit
    rev: v0.0.66
    hooks:
      - id: ty
  - repo: local
    hooks:
      - id: generate-notice
        name: Generate NOTICE.md
        entry: python scripts/generate_notice.py
        language: system
        pass_filenames: false
        always_run: true
        files: ^(uv\.lock|scripts/generate_notice\.py)$
